name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: go vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...

  links:
    name: link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install lychee 0.20.1
        run: |
          curl -fsSL -o /tmp/lychee.tar.gz -L \
            https://github.com/lycheeverse/lychee/releases/download/lychee-v0.20.1/lychee-x86_64-unknown-linux-gnu.tar.gz
          sudo tar -C /usr/local/bin -xzf /tmp/lychee.tar.gz
          lychee --version
      - name: Check links
        env:
          # Lychee uses this for github.com links. Unauthenticated checks
          # from Actions get 403/429/503 once the shared IP is rate limited.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: lychee --config .lychee.toml .
